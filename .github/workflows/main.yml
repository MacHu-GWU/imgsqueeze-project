# comprehensive github action yml reference: https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions
# estimate build time:
# - Linux: 15s
# - Windows: 40s

---
# Name of the workflow as it will appear in the GitHub Actions tab
# ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#name
name: CI

# Define the events that will trigger this workflow to run
# ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#on
on:
#  push: # Workflow will run on any push event to the main branch
#    branches: ["main"]
#  pull_request: # Workflow will run on any pull request targeting the main branch
#    branches: ["main"]
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub UI

# ------------------------------------------------------------------------------
# Custom workflow level variables
# ------------------------------------------------------------------------------
# Define environment variables at the workflow level - accessible to all jobs
env:
  PACKAGE_NAME: "imgsqueeze"
  # mise is only used for pngquant and oxipng. Ignore the repo's mise.toml: its [env] block
  # reads local secrets, and its [tools] are for the dev machine (Python comes from setup-python).
  MISE_IGNORED_CONFIG_PATHS: "${{ github.workspace }}"

jobs:
  tests:
    # Dynamic name that includes the current OS and Python version from the matrix
    name: "${{ matrix.os }} Python ${{ matrix.python-version }}"
    # Specifies the runner environment (VM) for the job - dynamically set from the matrix
    # GitHub provides various VM options like ubuntu, windows, and macOS
    # For all available VM runtime, see this: https://docs.github.com/en/free-pro-team@latest/actions/reference/specifications-for-github-hosted-runners
    runs-on: "${{ matrix.os }}"
    env: # Define environment variables that will be available to all steps in this job
      # This comma-separated list defines which Python versions should have coverage reports
      # Will be used later to conditionally upload coverage reports to Codecov
      USING_COVERAGE: "3.12"
    # ref: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstrategymatrix
    strategy:
      # The matrix strategy allows you to run multiple combinations of configurations
      # This will create a separate job for each combination of OS and Python version
      matrix:
        # imgsqueeze targets macOS. Ubuntu is the closest runner where mise can install
        # pngquant and oxipng, so CI runs only there, and only on the dev Python.
        os: ["ubuntu-latest"]
        python-version: ["3.12"]
    steps:
      # Check out the repository code to the runner
      - uses: "actions/checkout@v7" # https://github.com/marketplace/actions/checkout
      # Setup Python with the specified version from the matrix
      - uses: "actions/setup-python@v7" # https://github.com/marketplace/actions/setup-python
        id: setup-python
        with:
          python-version: "${{ matrix.python-version }}"
      # Install uv - fast Python package installer
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v10.3.0" # https://github.com/marketplace/actions/setup-uv (no floating major tag, pin the full version)
        with:
          # The next step caches the whole .venv, so uv's own download cache is redundant.
          # With both on, reruns warn "Unable to reserve cache ... another job may be creating this cache".
          enable-cache: false
      # Cache the .venv directory, so uv sync has nothing to install when dependencies are unchanged.
      # The key uses the FULL Python version (e.g. 3.13.15) reported by setup-python, not the matrix
      # value (3.13): a .venv points at its interpreter's path, and when the runner image ships a new
      # patch release, a venv cached under the old patch is broken ("linked to non-existent Python interpreter").
      - name: "Cache venv"
        uses: "actions/cache@v6"
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('uv.lock') }}
      # Install mise without any tools, then the pinned pngquant and oxipng that
      # imgsqueeze.tools resolves with "mise which --tool". The png_tools fixture
      # would install them itself; doing it here keeps the install visible in the log.
      - name: "Install mise"
        uses: "jdx/mise-action@v5" # https://github.com/jdx/mise-action
        with:
          install: false
      - name: "Install pngquant and oxipng"
        run: mise install conda:pngquant@3.0.3 oxipng@10.2.1
      # Install project dependencies using uv (skip if cache hit)
      - name: "Install dependencies"
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv sync --extra test
      # Run pytest with coverage reporting. --extra test is a safety net: if uv ever has to rebuild
      # the .venv here, it installs the test extra too, so pytest is never missing.
      - name: "Run pytest"
        run: "uv run --extra test pytest tests --cov=${{ env.PACKAGE_NAME }} --cov-report=xml --cov-report term-missing"
      # Upload coverage report to Codecov
      # The 'if' condition checks if the current Python version should report coverage
      # For the first time setup, you should to goto codecov.io, enable your repo,
      # copy the upload token, and create an CODECOV_TOKEN env var in GitHub actions secret
      - name: "Upload coverage to Codecov"
        if: "contains(env.USING_COVERAGE, matrix.python-version)"
        uses: "codecov/codecov-action@v7" # https://github.com/marketplace/actions/codecov
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Authentication token from repository secrets
          slug: ${{ github.repository }} # Repository identifier
          files: ./coverage.xml # Path to the coverage report generated by pytest (the old "file" input was removed)
          verbose: true
          fail_ci_if_error: true # Fail the workflow if the Codecov upload fails
